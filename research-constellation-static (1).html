  #rc-root {

    padding: 1.25rem clamp(1.25rem, 4vw, 2.75rem) 1rem;

    overflow: hidden;
  }

    font-family: 'Lora', 'Times New Roman', serif;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    margin: 0;
  }
  .rc-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    position: relative;
    z-index: 30;
    font-family: 'Lora', 'Times New Roman', serif;
    font-size: clamp(0.8rem, 2.8vw, 1.125rem);
    font-weight: 700;
    white-space: nowrap;
  }

  .rc-filter { position: relative; flex: 0 0 auto; }
  .rc-filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--rc-card);
    border: 1px solid var(--rc-border);
    color: var(--rc-ink);
    font-size: 0.82rem;
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .rc-filter-btn:hover { background: rgba(15,23,42,0.06); border-color: rgba(15,23,42,0.16); }

  .rc-filter-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #9aa5c0;
    box-shadow: 0 0 5px currentColor;
  }

  .rc-filter-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    min-width: 240px;
    background: rgba(255,255,255,0.98);
    border: 1px solid var(--rc-border);
    border-radius: 14px;
    padding: 0.4rem;
    box-shadow: 0 18px 40px -16px rgba(15,23,42,0.25);
    display: none;
    backdrop-filter: blur(8px);
  }
  .rc-filter-panel.open { display: block; }
  .rc-filter-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    width: 100%;
    background: none;
    border: none;
    color: var(--rc-ink);
    text-align: left;
    font-size: 0.82rem;
    padding: 0.55rem 0.65rem;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .rc-filter-option:hover { background: rgba(15,23,42,0.05); }
  .rc-filter-option.active { background: rgba(15,23,42,0.08); color: #000; }
  .rc-filter-option .rc-count { color: var(--rc-faint); font-size: 0.72rem; }
  .rc-filter-option.active .rc-count { color: var(--rc-muted); }
  .rc-filter-option.rc-filter-divider {
    border-top: 1px solid var(--rc-border);
    margin-top: 0.3rem;
    padding-top: 0.65rem;
  }

  /* ---- viz area ---- */
  .rc-stage {
    position: relative;
    margin-top: 0.35rem;
    z-index: 2;
  }
  .rc-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .rc-edge {
    stroke: #a7afc2;
    stroke-opacity: 0;
    stroke-width: 1;
    transition: stroke-opacity 0.35s ease, stroke-width 0.25s ease, stroke 0.25s ease;
    fill: none;
  }
  .rc-edge-hit {
    stroke: transparent;
    stroke-width: 14px;
    pointer-events: none;
    cursor: pointer;
    fill: none;
  }
  #rc-root.rc-explore .rc-edge-hit { pointer-events: stroke; }
  .rc-node-halo {
    fill: currentColor;
    opacity: 0.16;
    transition: opacity 0.35s ease, r 0.35s ease;
  }
  .rc-node-core {
    stroke: rgba(255,255,255,0.9);
    stroke-width: 1.25;
    transition: opacity 0.35s ease, r 0.35s ease, filter 0.35s ease;
    cursor: pointer;
  }
  .rc-node-group { opacity: 1; transition: opacity 0.35s ease; }
  .rc-node-group.rc-twinkle .rc-node-core { animation: rc-twinkle 4.5s ease-in-out infinite; }
  @keyframes rc-twinkle {
    0%, 100% { opacity: 0.86; }
    50% { opacity: 1; }

  .rc-tooltip {

    z-index: 50;
    max-width: 280px;
    background: rgba(255,255,255,0.98);
    border: 1px solid rgba(15,23,42,0.08);

    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
    font-weight: 600;

  .rc-tooltip-tldr { color: var(--rc-muted); margin: 0 0 0.45rem; }
  .rc-tooltip-meta { color: var(--rc-faint); font-size: 0.72rem; margin: 0; }

  .rc-tooltip-edge-themes { color: var(--rc-muted); margin: 0 0 0.55rem; }
  .rc-tooltip-edge-pair { display: flex; flex-direction: column; gap: 0.4rem; }
  .rc-tooltip-edge-paper {
    display: block;
    font-size: 0.78rem;
    line-height: 1.35;
    color: #23262d;

  .rc-tooltip-edge-paper:hover { background: rgba(15,23,42,0.08); }
  .rc-tooltip-edge-paper small { display: block; color: var(--rc-faint); font-size: 0.68rem; margin-top: 2px; }

  /* ---- legend ---- */
  .rc-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.3rem 0.6rem;
    margin-top: 0.5rem;
    position: relative;
    z-index: 2;
  }
  .rc-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
    color: var(--rc-muted);
    font-family: 'Lora', 'Times New Roman', serif;
    line-height: 1.4;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 4px 6px;
    cursor: pointer;
    text-align: left;
    max-width: 100%;
  }
  .rc-legend-item:hover { background: var(--rc-card); }
  .rc-legend-item[aria-pressed="true"] {
    background: var(--rc-card);
    border-color: currentColor;
  }
  .rc-legend-item:focus-visible {
    outline: 2px solid var(--rc-link);
    outline-offset: 2px;
  }
  .rc-legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    box-shadow: 0 0 5px currentColor;
    flex: none;
  }

    .rc-filter-panel { right: 0; left: auto; }
    .rc-filter-btn { font-size: 0.75rem; padding: 0.5rem; gap: 0.3rem; }

      .html(a.title + "<small>" + paperMeta(a) + "</small>");
    tooltip.select("#rc-tt-edge-b")
      .attr("href", b.link)
      .html(b.title + "<small>" + paperMeta(b) + "</small>");

  function onHoverEnd() {

  /* ---- filter dropdown ---- */
  var activeFilter = "all";

  var filterBtn = document.getElementById("rc-filter-btn");
  var filterLabel = document.getElementById("rc-filter-label");
  var filterPanel = document.getElementById("rc-filter-panel");

  function filterCount(fid) {

  }

  FILTERS.forEach(function (f) {
    var btn = document.createElement("button");
    btn.className = "rc-filter-option" + (f.id === "all" ? " active" : "") + (f.divider ? " rc-filter-divider" : "");
    btn.setAttribute("data-filter", f.id);

  function matchesFilter(n) {

  // Returns 'primary' | 'linked' | 'clustered' | null for a node given the

      }

      return (hn && d.cluster === hn.cluster) ? "clustered" : null;

  }

  function updateVisualState() {
    var exploring = activeFilter === "connections";
    rcRoot.classList.toggle("rc-explore", exploring);
    d3.selectAll("#rc-legend .rc-legend-item")
      .attr("aria-pressed", function () {
        return this.getAttribute("data-cluster") === activeCluster ? "true" : "false";
      });

    edgeGroups.style("opacity", function (e) {
      return activeCluster && (nodeById[edgeSourceId(e)].cluster !== activeCluster ||
        nodeById[edgeTargetId(e)].cluster !== activeCluster) ? 0.14 : 1;
    });

    nodeGroups.each(function (d) {
      var g = d3.select(this);
      var filterFactor = matchesFilter(d) && (!activeCluster || d.cluster === activeCluster) ? 1 : 0.14;
      var emph = nodeEmphasis(d);
      var hoverFactor = emph === undefined ? 1 : (emph === null ? 0.22 : (emph === "clustered" ? 0.65 : 1));
      var emphasized = emph === "primary" || emph === "linked";
      var finalOpacity = Math.max(filterFactor * hoverFactor, 0.08);
      g.style("opacity", finalOpacity);

      var baseR = (activeFilter === "representative" && d.representative) ? d.r * 1.55 : d.r;
      var displayR = emphasized ? baseR * 1.4 : baseR;

      g.select(".rc-node-core")
        .attr("r", displayR)
        .style("filter", emphasized ? "drop-shadow(0 0 6px " + d.color + ")" : "none");
      g.select(".rc-node-halo")
        .attr("r", displayR * (emphasized ? 2.2 : 2.4))
        .style("opacity", emphasized ? 0.28 : 0.14);
    });

    edgeSel.each(function (e) {
      var line = d3.select(this);
      var sId = edgeSourceId(e), tId = edgeTargetId(e);
      if (!exploring) {
        line.style("stroke-opacity", 0);
        return;
      }
      var base = 0.14;
      if (hoveredNodeId) {
        base = (sId === hoveredNodeId || tId === hoveredNodeId) ? 0.55 : 0.03;
      } else if (hoveredEdgeIds) {
        var isThisEdge = (sId === hoveredEdgeIds[0] && tId === hoveredEdgeIds[1]) ||
                          (sId === hoveredEdgeIds[1] && tId === hoveredEdgeIds[0]);
        base = isThisEdge ? 0.85 : 0.03;
        line.style("stroke-width", isThisEdge ? "1.8px" : "1px");
        line.style("stroke", isThisEdge ? "#5b667a" : "#a7afc2");
      }
      if (!hoveredEdgeIds) { line.style("stroke-width", "1px"); line.style("stroke", "#a7afc2"); }
      line.style("stroke-opacity", base);
    });
  }

  /* ============================ PHYSICS =============================== */

  // If this is an exported static copy (EXPORTED_LAYOUT baked in) and/or a
  // manual layout was saved earlier in this browser (localStorage, which
  // takes priority per-paper), we skip animating the algorithmic settle and
  // jump straight to those positions on the very first frame. (Otherwise
  // the stars would fly into their algorithmic spots and THEN snap to the
  // fixed layout once the simulation ended — a visible "shift".) Everyone
  // else gets the live force-simulated layout, animating into place under
  // the two-row cluster anchors above.
  var savedLayoutOnLoad = Object.assign({}, EXPORTED_LAYOUT || {}, loadSavedLayout());
  var hasSavedLayoutOnLoad = Object.keys(savedLayoutOnLoad).length > 0;

  var sim = d3.forceSimulation(nodes)
    .force("charge", d3.forceManyBody().strength(-75))
    .force("collide", d3.forceCollide().radius(function (d) { return d.r + 7; }))
    .force("link", d3.forceLink(edges).id(function (d) { return d.id; }).distance(58).strength(0.18))
    .force("x", d3.forceX(function (d) { return clusterById[d.cluster].ax; }).strength(0.09))
    .force("y", d3.forceY(function (d) { return clusterById[d.cluster].ay; }).strength(0.09));

  function renderPositions() {
    nodeGroups.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
    // by the time forces have initialized, d.source/d.target on each edge are
    // already the resolved node objects (not id strings) — use them directly.
    // Both the visible line and its wider invisible hover target share the
    // same datum (the edge), so updating all <line> children at once keeps
    // them in sync.
    edgeGroups.selectAll("line")
      .attr("x1", function (d) { return nodeById[edgeSourceId(d)].x; })
      .attr("y1", function (d) { return nodeById[edgeSourceId(d)].y; })
      .attr("x2", function (d) { return nodeById[edgeTargetId(d)].x; })
      .attr("y2", function (d) { return nodeById[edgeTargetId(d)].y; });
  }

  function fitConstellation() {

    var minX = d3.min(nodes, function (d) { return d.x0; }) - pad;
    var maxX = d3.max(nodes, function (d) { return d.x0; }) + pad;
    var minY = d3.min(nodes, function (d) { return d.y0; }) - pad;
    var maxY = d3.max(nodes, function (d) { return d.y0; }) + pad;
    svg.attr("viewBox", [minX, minY, maxX - minX, maxY - minY].join(" "));
  }

  if (hasSavedLayoutOnLoad) {
    // Fast-forward the simulation silently (no rendered ticks, no "end"
    // event) so we still know where the algorithmic layout would have
    // settled — that's what "Reset layout" falls back to — then paint once,
    // directly at the saved positions.
    sim.stop();
    for (var _i = 0; _i < 300; _i++) sim.tick();
    nodes.forEach(function (d) {
      d.origX0 = d.x;
      d.origY0 = d.y;
      var pos = savedLayoutOnLoad[d.id];
      if (pos && typeof pos.x === "number" && isFinite(pos.x) && typeof pos.y === "number" && isFinite(pos.y)) {
        d.x = pos.x;
        d.y = pos.y;
      }
      d.x0 = d.x;
      d.y0 = d.y;

    renderPositions();
    requestAnimationFrame(driftFrame);
  } else {
    sim.on("tick", renderPositions).on("end", startDrift);
  }

  function startDrift() {
    nodes.forEach(function (d) {
      d.x0 = d.x;
      d.y0 = d.y;
      // remembered so "Reset layout" can restore the automatic arrangement
      // even after making a manual rearrangement
      d.origX0 = d.x;
      d.origY0 = d.y;
    });
    fitConstellation();
    renderPositions();
    requestAnimationFrame(driftFrame);
  }

  function driftFrame(t) {
    nodes.forEach(function (d) {
      if (d.dragging) return; // actively being dragged — dragged() sets position directly
      d.x = d.x0 + d.driftAx * Math.sin(t * d.driftWx + d.driftPx);
      d.y = d.y0 + d.driftAy * Math.sin(t * d.driftWy + d.driftPy);
    });
    renderPositions();
    requestAnimationFrame(driftFrame);
  }

  /* ============================ LEGEND ================================ */

  var legend = d3.select("#rc-legend");
  LEGEND_ORDER.forEach(function (id) {
    var c = clusterById[id];
    if (!c) return;
    var item = legend.append("button")
      .attr("type", "button")
      .attr("class", "rc-legend-item")
      .attr("data-cluster", id)
      .attr("aria-pressed", "false")
      .style("color", c.color)
      .on("click", function () {
        activeCluster = activeCluster === id ? null : id;
        onHoverEnd();
      });
    item.append("span").attr("class", "rc-legend-dot").style("background", c.color);
    item.append("span").text(c.label).style("color", "var(--rc-muted)");
  });

  updateVisualState();
})();
</script></body></html>
