  style="display: block; width: 100%; max-width: 1040px; height: 850px; margin: 1rem auto; border: 0;"

<script>
  (function () {
    var frame = document.getElementById('research-constellation-frame');
    frame.addEventListener('load', function () {
      var root = frame.contentDocument.getElementById('rc-root');
      if (!root) return;
      function resizeFrame() {
        frame.style.height = Math.ceil(root.getBoundingClientRect().bottom + 16) + 'px';
      }
      resizeFrame();
      new ResizeObserver(resizeFrame).observe(root);
    });
  })();
</script>
